    <script>
        // Temas de temporada (se cambian solos según la fecha del equipo):
        //   15 oct – 3 nov   -> Día de Muertos
        //   15 nov – 28 dic  -> Navidad
        //   el resto del año -> kiosco normal
        // Para probar o cambiar a mano:
        //   kiosk.html?tema=muertos | navidad | halloween | normal
        (function () {
            var tema = new URLSearchParams(location.search).get('tema');
            var hoy = new Date();
            var fecha = (hoy.getMonth() + 1) * 100 + hoy.getDate(); // ej. 15 de octubre = 1015
            var auto = null;
            if (fecha >= 1015 && fecha <= 1103) auto = 'muertos';
            else if (fecha >= 1115 && fecha <= 1228) auto = 'navidad';
            var activo = ['muertos', 'navidad', 'halloween'].indexOf(tema) >= 0 ? tema
                : (tema !== 'normal' ? auto : null);
            if (activo) document.body.classList.add('theme-' + activo);
        })();
    </script>

    <script>
        // Arma el papel picado, los pétalos, el polvo dorado y el rosetón solo con el tema de Día de Muertos
        (function () {
            if (!document.body.classList.contains('theme-muertos')) return;
            function rnd(a, b) { return a + Math.random() * (b - a); }

            var colores = ['#D4A64A', '#E07A1F', '#B8873A', '#7A1230', '#E9C46A'];
            ['.dm-papel-l', '.dm-papel-r'].forEach(function (sel, lado) {
                var html = '';
                for (var i = 0; i < 7; i++) {
                    html += '<div class="dm-flag" style="--c:' + colores[(i + lado * 2) % colores.length] +
                        ';--delay:-' + rnd(0, 4).toFixed(2) + 's"><svg viewBox="0 0 60 76"><use href="#dm-flag-shape"/></svg></div>';
                }
                document.querySelector(sel).innerHTML = html;
            });

            var petalos = '';
            for (var p = 0; p < 8; p++) {
                petalos += '<div class="dm-petal" style="--x:' + rnd(0, 100).toFixed(1) + '%;--d:' + rnd(13, 20).toFixed(1) +
                    's;--delay:-' + rnd(0, 20).toFixed(1) + 's;--w:' + rnd(7, 12).toFixed(0) + 'px;--f:' + rnd(2.2, 3.6).toFixed(1) + 's"><i></i></div>';
            }
            document.querySelector('.dm-petals').innerHTML = petalos;

            var chispas = '';
            for (var s = 0; s < 18; s++) {
                chispas += '<i class="dm-spark" style="--x:' + rnd(0, 100).toFixed(1) + '%;--d:' + rnd(14, 26).toFixed(1) +
                    's;--delay:-' + rnd(0, 26).toFixed(1) + 's;--s:' + rnd(2, 5).toFixed(1) + 'px;--dx:' + rnd(-6, 6).toFixed(1) + 'vw"></i>';
            }
            document.querySelector('.dm-sparks').innerHTML = chispas;

            // Rosetón: círculos, pétalos, festón y rayos finos
            var rad = Math.PI / 180, d = [], k;
            function P(r, a) { return (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1); }
            [58, 96, 150, 188].forEach(function (r) {
                d.push('M' + (-r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0');
            });
            for (k = 0; k < 16; k++) {
                var a = 22.5 * k * rad;
                d.push('M' + P(58, a) + 'Q' + P(84, a - 9 * rad) + ' ' + P(96, a) + 'Q' + P(84, a + 9 * rad) + ' ' + P(58, a));
            }
            var feston = 'M' + P(150, 0);
            for (k = 0; k < 24; k++) feston += 'Q' + P(112, (15 * k + 7.5) * rad) + ' ' + P(150, 15 * (k + 1) * rad);
            d.push(feston);
            for (k = 0; k < 48; k++) d.push('M' + P(k % 2 ? 156 : 152, 7.5 * k * rad) + 'L' + P(182, 7.5 * k * rad));
            document.getElementById('dm-roseton-path').setAttribute('d', d.join(' '));
        })();
    </script>

    <script>
        // Arma la guirnalda de foquitos y la nieve solo con el tema de Navidad
        (function () {
            if (!document.body.classList.contains('theme-navidad')) return;
            function rnd(a, b) { return a + Math.random() * (b - a); }
            var angosto = window.innerWidth < 600;

            // Guirnalda: varios tramos colgando, con foquitos sobre la curva
            var tramos = angosto ? 2 : (window.innerWidth < 1000 ? 3 : 4);
            var porTramo = angosto ? 5 : 7;
            var caida = angosto ? 16 : 22; // px que cuelga cada tramo en el centro
            var colores = ['#FF4D4D', '#FFD166', '#4CD787', '#FFF4D6', '#5BC0FF'];
            var cable = '', focos = '', n = 0;
            for (var t = 0; t < tramos; t++) {
                var x0 = t * 1000 / tramos, x1 = (t + 1) * 1000 / tramos;
                cable += 'M' + x0.toFixed(1) + ' 6Q' + ((x0 + x1) / 2).toFixed(1) + ' ' + (6 + 2 * caida) + ' ' + x1.toFixed(1) + ' 6';
                for (var j = 0; j < porTramo; j++) {
                    var u = (j + 0.5) / porTramo;
                    var x = (x0 + u * (x1 - x0)) / 10;          // %
                    var y = 6 + 4 * caida * u * (1 - u);        // px
                    focos += '<i class="xm-bulb" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(1) + 'px;--c:' +
                        colores[n % colores.length] + ';--r:' + rnd(-10, 10).toFixed(0) + 'deg;--t:' + rnd(1.2, 2.4).toFixed(2) +
                        's;--delay:-' + rnd(0, 2.4).toFixed(2) + 's"></i>';
                    n++;
                }
            }
            document.querySelector('.xm-lights').innerHTML =
                '<svg viewBox="0 0 1000 64" preserveAspectRatio="none"><path class="xm-wire" d="' + cable + '"/></svg>' + focos;

            // Nieve: copitos suaves y algunos copos de cristal más grandes
            var nieve = '', total = angosto ? 28 : 46;
            for (var k = 0; k < total; k++) {
                nieve += '<div class="xm-flake" style="--x:' + rnd(0, 100).toFixed(1) + '%;--d:' + rnd(9, 18).toFixed(1) +
                    's;--delay:-' + rnd(0, 18).toFixed(1) + 's"><i style="--s:' + rnd(3, 8).toFixed(1) + 'px;--o:' +
                    rnd(0.45, 0.95).toFixed(2) + ';--f:' + rnd(2.2, 4.2).toFixed(1) + 's"></i></div>';
            }
            for (var g = 0; g < (angosto ? 4 : 7); g++) {
                nieve += '<div class="xm-flake" style="--x:' + rnd(0, 100).toFixed(1) + '%;--d:' + rnd(16, 26).toFixed(1) +
                    's;--delay:-' + rnd(0, 26).toFixed(1) + 's"><svg class="xm-crystal" viewBox="-10 -10 20 20" style="--s:' +
                    rnd(14, 26).toFixed(0) + 'px;--f:' + rnd(7, 12).toFixed(1) + 's"><use href="#xm-flake-shape"/></svg></div>';
            }
            document.querySelector('.xm-snowfall').innerHTML = nieve;
        })();
    </script>

    </div>
    <script>
        // Kiosco normal: la frase de arriba va cambiando sola y el reloj se actualiza
        (function () {
            if (/\btheme-/.test(document.body.className)) return;
            var frases = ['Atlas Gym', 'Forja tu mejor versión', 'Un día más, una repetición más', 'La constancia construye'];
            var el = document.getElementById('k-kicker-main');
            var i = 0;
            setInterval(function () {
                el.classList.add('nm-fade');
                setTimeout(function () {
                    i = (i + 1) % frases.length;
                    el.textContent = frases[i];
                    el.classList.remove('nm-fade');
                }, 450);
            }, 6000);

            var hora = document.getElementById('nm-time'), fecha = document.getElementById('nm-date');
            function reloj() {
                var ahora = new Date();
                hora.textContent = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
                fecha.textContent = ahora.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
            }
            reloj();
            setInterval(reloj, 15000);
        })();
    </script>

    <script type="module">
        import { database } from './firebase-config.js';
        import { ref, get, push, set, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const db = {
            get: async (key) => {
                const snapshot = await get(ref(database, key));
                return snapshot.exists() ? snapshot.val() : null;
            },
            add: (collection, data) => {
                const newRef = push(ref(database, collection));
                return set(newRef, data);
            }
        };

        // ===== CACHÉ EN TIEMPO REAL =====
        // Suscribirse una vez a socios y visitas. Así cada ingreso se resuelve al
        // instante desde memoria (sin descargar en cada código) y aguanta cortes de red.
        let membersCache = null;   // { id: socio }  (null = aún no carga)
        let visitsCache = {};      // { id: visita }
        let isOnline = true;

        onValue(ref(database, 'members'),
            (snap) => { membersCache = snap.exists() ? snap.val() : {}; scheduleLive(); },
            (err) => { console.error('members listener', err); });
        onValue(ref(database, 'visits'),
            (snap) => { visitsCache = snap.exists() ? snap.val() : {}; scheduleLive(); },
            (err) => { console.error('visits listener', err); });

        // ===== INFORMACIÓN EN VIVO (kiosco normal) =====
        // El socio con la racha activa más larga (solo su primer nombre).
        var liveTimer = null; // var: puede usarse antes de esta línea si Firebase responde de inmediato
        function scheduleLive() { clearTimeout(liveTimer); liveTimer = setTimeout(updateLive, 300); }
        function updateLive() {
            const box = document.getElementById('nm-live');
            if (!box || /\btheme-/.test(document.body.className) || membersCache === null) return;
            const porCodigo = {};
            Object.values(visitsCache).forEach(v => {
                if (v.status !== 'success') return;
                (porCodigo[String(v.code)] = porCodigo[String(v.code)] || []).push(kLocalKey(v.date));
            });
            const nombres = {};
            Object.values(membersCache).forEach(m => { nombres[String(m.code)] = m.name || ''; });
            let lider = null;
            Object.keys(porCodigo).forEach(c => {
                if (!nombres[c]) return;
                const s = kComputeStreak(porCodigo[c]);
                if (s.current > 0 && (!lider || s.current > lider.current)) lider = { name: nombres[c], current: s.current };
            });
            let html = '';
            if (lider) {
                const primer = lider.name.split(' ')[0];
                const nombre = primer.charAt(0) + primer.slice(1).toLowerCase();
                html = `<span><i class="fas fa-fire-flame-curved"></i> Racha líder: <b>${nombre}</b> · ${lider.current} día${lider.current === 1 ? '' : 's'}</span>`;
            }
            box.innerHTML = html;
        }
        setInterval(updateLive, 60000);

        // Estado de conexión (indicador visible)
        onValue(ref(database, '.info/connected'), (snap) => {
            isOnline = snap.val() === true;
            const dot = document.getElementById('k-conn');
            if (dot) {
                dot.classList.toggle('on', isOnline);
                dot.classList.toggle('off', !isOnline);
                dot.title = isOnline ? 'Conectado' : 'Sin conexión';
                const txt = dot.querySelector('.k-conn-txt');
                if (txt) txt.textContent = isOnline ? 'En línea' : 'Sin conexión';
            }
        });

        const inp = document.getElementById('k-input');
        const msg = document.getElementById('k-msg');
        const sub = document.getElementById('k-sub');
        const body = document.body;

        // ===== RACHA (FLAMITA) =====
        // Cada día con ingreso suma 1. Solo se perdonan sábado y domingo;
        // faltar un día entre semana rompe la racha.
        function kLocalKey(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
        function kGapWeekend(aKey, bKey) {
            const a = new Date(aKey + 'T00:00:00'), b = new Date(bKey + 'T00:00:00');
            const d = new Date(a); d.setDate(d.getDate() + 1);
            while (d < b) { const w = d.getDay(); if (w !== 0 && w !== 6) return false; d.setDate(d.getDate() + 1); }
            return true;
        }
        function kComputeStreak(keysArr) {
            const keys = Array.from(new Set(keysArr)).sort();
            if (keys.length === 0) return { current: 0, best: 0 };
            let best = 1, run = 1;
            for (let i = 1; i < keys.length; i++) { if (kGapWeekend(keys[i - 1], keys[i])) run++; else run = 1; if (run > best) best = run; }
            let cur = 1;
            for (let i = keys.length - 1; i > 0; i--) { if (kGapWeekend(keys[i - 1], keys[i])) cur++; else break; }
            // Racha "viva": solo cuenta si la última asistencia conecta con hoy (igual que la app)
            const todayKey = kLocalKey(new Date());
            const lastKey = keys[keys.length - 1];
            const current = (lastKey === todayKey || kGapWeekend(lastKey, todayKey)) ? cur : 0;
            return { current, best };
        }

        // Posición del socio en el Ranking de Rachas (racha activa; desempate por récord y días totales)
        // validCodes: solo cuenta socios actuales (igual que la app), ignora códigos de socios borrados.
        function kComputeRankPosition(visitsData, code, todayKey, validCodes) {
            const idx = {};
            Object.values(visitsData).forEach(function (v) {
                if (v.status !== 'success') return;
                const c = String(v.code);
                (idx[c] = idx[c] || []).push(kLocalKey(v.date));
            });
            // El socio actual incluye su ingreso de hoy (aún no escrito en la BD)
            const cc = String(code);
            (idx[cc] = idx[cc] || []).push(todayKey);

            const list = Object.keys(idx).map(function (c) {
                const stk = kComputeStreak(idx[c]);
                return { code: c, current: stk.current, best: stk.best, total: new Set(idx[c]).size };
            }).filter(function (a) {
                return a.current >= 1 && (!validCodes || validCodes.has(a.code));
            }).sort(function (x, y) { return y.current - x.current || y.best - x.best || y.total - x.total; });

            const pos = list.findIndex(function (a) { return a.code === cc; });
            return { position: pos >= 0 ? pos + 1 : null, total: list.length };
        }

        // Detect Touch Device
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        if (isTouch) {
            // Mobile/Tablet: Disable native keyboard and auto-focus
            inp.setAttribute('readonly', 'true');
        } else {
            // Desktop: Keep focus for physical keyboard
            document.body.onclick = () => inp.focus();
            inp.focus();
        }

        // Virtual Keypad Logic
        window.pressKey = (key) => {
            if (key === 'DEL') {
                inp.value = inp.value.slice(0, -1);
            } else if (key === 'ENTER') {
                processCode();
            } else {
                if (inp.value.length < 5) {
                    inp.value += key;
                }
            }
        };

        // ========== CONFETTI ENGINE ==========
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimFrame = null;

        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        function createConfettiParticle() {
            const colors = ['#E5261F', '#FFC94A', '#FFFFFF', '#34B871', '#5B93F5', '#F06A2A', '#C79BFF'];
            return {
                x: Math.random() * confettiCanvas.width,
                y: Math.random() * confettiCanvas.height * -1 - 10,
                w: Math.random() * 12 + 6,
                h: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                velocityX: (Math.random() - 0.5) * 4,
                velocityY: Math.random() * 4 + 2,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 10,
                opacity: 1,
                shape: Math.random() > 0.5 ? 'rect' : 'circle'
            };
        }

        function launchConfetti() {
            confettiParticles = [];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push(createConfettiParticle());
            }
            animateConfetti();
            setTimeout(() => {
                for (let i = 0; i < 100; i++) confettiParticles.push(createConfettiParticle());
            }, 500);
            setTimeout(() => {
                for (let i = 0; i < 80; i++) confettiParticles.push(createConfettiParticle());
            }, 1200);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiParticles.forEach((p, index) => {
                p.x += p.velocityX;
                p.y += p.velocityY;
                p.rotation += p.rotationSpeed;
                p.velocityY += 0.05;
                p.opacity -= 0.002;
                if (p.opacity <= 0 || p.y > confettiCanvas.height + 20) {
                    confettiParticles.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = p.color;
                if (p.shape === 'rect') {
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
            if (confettiParticles.length > 0) {
                confettiAnimFrame = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                if (confettiAnimFrame) cancelAnimationFrame(confettiAnimFrame);
            }
        }

        function stopConfetti() {
            confettiParticles = [];
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            if (confettiAnimFrame) cancelAnimationFrame(confettiAnimFrame);
        }

        // ========== BIRTHDAY CHECK ==========
        function isBirthdayMonth(dob) {
            if (!dob) return false;
            const parts = dob.split('-');
            if (parts.length < 2) return false;
            return (Number(parts[1]) - 1) === new Date().getMonth();
        }

        function showBirthdayOverlay(firstName) {
            const overlay = document.getElementById('birthday-overlay');
            const titleEl = overlay.querySelector('.birthday-title');
            titleEl.textContent = '\u00a1FELIZ MES DE TU CUMPLEA\u00d1OS, ' + firstName + '!';
            overlay.classList.add('visible');
            launchConfetti();
        }

        function hideBirthdayOverlay() {
            const overlay = document.getElementById('birthday-overlay');
            overlay.classList.remove('visible');
            stopConfetti();
        }

        // ========== MAIN LOGIC ==========
        async function processCode() {
            const code = inp.value;
            if (code.length < 1) return;

            inp.disabled = true;
            msg.innerHTML = '<span class="k-processing">Verificando…</span>';

            try {
                // Lectura desde la CACHÉ local (no se descarga la base en cada código)
                if (membersCache === null) {
                    setErrorState("Cargando datos...", "Espera unos segundos e intenta de nuevo");
                    resetAfterDelay();
                    return;
                }

                const membersList = Object.values(membersCache);
                const m = membersList.find(mem => String(mem.code) === String(code));

                if (!m) {
                    setErrorState("Error: Código inexistente", "");
                    db.add("visits", { code: code, name: "Desconocido", date: new Date().toISOString(), status: "error", reason: "Código inexistente" });
                } else {
                    const days = Math.ceil((new Date(m.expiryDate) - new Date()) / (1000 * 60 * 60 * 24));

                    if (days < 0) {
                        setErrorState(`Membresía vencida el día ${new Date(m.expiryDate).toLocaleDateString()}`, "");
                        db.add("visits", { code: code, name: m.name, date: new Date().toISOString(), status: "expired", reason: "Membresía Vencida" });
                    } else {
                        // Racha y ranking desde la caché local (instantáneo, sin red)
                        let streak = { current: 1, best: 1 };
                        let rank = { position: null, total: 0 };
                        try {
                            const todayKey = kLocalKey(new Date());
                            const keys = Object.values(visitsCache)
                                .filter(v => String(v.code) === String(code) && v.status === "success")
                                .map(v => kLocalKey(v.date));
                            keys.push(todayKey);
                            streak = kComputeStreak(keys);
                            const validCodes = new Set(membersList.map(mm => String(mm.code)));
                            rank = kComputeRankPosition(visitsCache, code, todayKey, validCodes);
                        } catch (e) { /* si falla, racha mínima */ }
                        setSuccessState(m.name, days, m.expiryDate, m.dob, streak, rank);
                        db.add("visits", { code: code, name: m.name, date: new Date().toISOString(), status: "success" });
                    }
                }
            } catch (err) {
                console.error(err);
                setErrorState("ERROR SISTEMA", "Intenta de nuevo");
            }

            resetAfterDelay();
        }

        inp.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                processCode();
            }
        });
        
        function resetAfterDelay() {
            setTimeout(() => {
                inp.value = '';
                inp.disabled = false;
                resetState();          // primero se vuelve a mostrar la captura…
                hideBirthdayOverlay();
                inp.focus();           // …y luego se enfoca el campo
            }, 4000);
        }

        // Frases de temporada que salen al dar la bienvenida
        const THEME_PHRASES = {
            halloween: [
                'Entrena hasta que dé miedo.',
                'Hoy sudan hasta los fantasmas.',
                'Sin trucos: puro entreno.',
                'Que tiemblen las pesas.',
                'Monstruo en construcción.',
                '¿Dulce o entreno? Hoy, entreno.'
            ],
            muertos: [
                'El Catrín te saluda: a entrenar.',
                'Con elegancia, hasta los huesos.',
                'Ni la Catrina te alcanza.',
                'Fuerte de aquí al Mictlán.',
                'Músculo que no se muere.',
                'Tu mejor ofrenda: una buena rutina.'
            ],
            navidad: [
                'Ni el ponche te detiene.',
                'Entrena antes del recalentado.',
                'Santa también hace pierna.',
                'Tu mejor regalo: la constancia.',
                'Más fuerte que el frío.',
                'Hoy se entrena, mañana tamales.'
            ]
        };

        function setSuccessState(name, days, expiryDate, dob, streak, rank) {
            const firstName = name.split(' ')[0];
            const birthdayMonth = isBirthdayMonth(dob);

            // Racha + posición en el ranking, en la esquina superior derecha (no estorba el mensaje central)
            const sNum = streak ? streak.current : 0;
            const isRecord = streak && streak.current >= streak.best && streak.current > 1;
            const pos = rank && rank.position;
            const isLeader = pos === 1;
            let posTxt = '';
            if (pos === 1) posTxt = '<i class="fas fa-crown" style="color:#FFC94A;"></i> Líder #1';
            else if (pos === 2 || pos === 3) posTxt = `<i class="fas fa-medal" style="color:#FFC94A;"></i> Top #${pos}`;
            else if (pos) posTxt = `Top #${pos}`;
            const recTxt = isRecord ? '¡RÉCORD!' : '';
            const extra = [recTxt, posTxt].filter(Boolean).join(' · ');
            const streakEl = document.getElementById('k-streak');
            if (streakEl) {
                if (sNum > 0) {
                    streakEl.classList.toggle('leader', !!isLeader);
                    streakEl.innerHTML = `<i class="fas fa-fire-flame-curved flame"></i><span class="streak-num">${sNum}</span><span class="streak-txt">día${sNum === 1 ? '' : 's'} seguido${sNum === 1 ? '' : 's'}${extra ? '<br>' + extra : ''}</span>`;
                    streakEl.classList.add('show');
                } else {
                    streakEl.classList.remove('show', 'leader');
                    streakEl.innerHTML = '';
                }
            }

            const expiryMessage = `Tu membresía vence el <b>${new Date(expiryDate).toLocaleDateString()}</b>`;
            const daysMessage = days <= 5
                ? `<i class="fas fa-triangle-exclamation"></i> Quedan ${days} día${days === 1 ? '' : 's'}`
                : `<i class="fas fa-circle-check"></i> Acceso autorizado`;

            // Frase de temporada (solo si hay un tema activo)
            const themeKey = ['muertos', 'navidad', 'halloween'].find(t => body.classList.contains('theme-' + t)) || null;
            const phrases = themeKey ? THEME_PHRASES[themeKey] : null;
            const hwPhrase = phrases
                ? `<span class="k-theme-phrase">${phrases[Math.floor(Math.random() * phrases.length)]}</span>`
                : '';

            body.classList.remove('k-ok', 'k-err', 'k-bday');
            body.classList.add(birthdayMonth ? 'k-bday' : 'k-ok');
            msg.innerHTML = `<span class="k-icon"><i class="fas fa-check"></i></span><span class="k-big">¡Bienvenido, ${firstName}!</span>`;
            sub.innerHTML = `${daysMessage}<span class="k-sub2">${expiryMessage}</span>${hwPhrase}`;
            if (birthdayMonth) showBirthdayOverlay(firstName);
        }

        function setErrorState(title, subtitle) {
            body.classList.remove('k-ok', 'k-bday');
            body.classList.add('k-err');
            msg.innerHTML = `<span class="k-icon"><i class="fas fa-xmark"></i></span><span class="k-big">${title}</span>`;
            sub.innerHTML = subtitle;
        }

        function resetState() {
            body.classList.remove('k-ok', 'k-err', 'k-bday');
            msg.innerHTML = '';
            sub.innerHTML = '';
            const se = document.getElementById('k-streak');
            if (se) { se.classList.remove('show', 'leader'); se.innerHTML = ''; }
        }
    </script>
</body>
